spring:
  application:
    name: power-bank-rental

  # MongoDB: 고장 신고(damage_report) 저장용
  data:
    mongodb:
      uri: mongodb://localhost:27017/powerbank

  # H2 파일 기반 DB: Member / PowerBank / Rental 저장용 (재시작해도 데이터 유지)
  datasource:
    url: jdbc:h2:file:./data/powerbank;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
